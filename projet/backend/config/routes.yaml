controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

# Documentation Swagger UI
app.swagger_ui:
    path: /api/doc
    methods: GET
    defaults:
        _controller: nelmio_api_doc.controller.stoplight

# Documentation JSON
app.swagger:
    path: /api/doc.json
    methods: GET
    defaults:
        _controller: nelmio_api_doc.controller.swagger_json
